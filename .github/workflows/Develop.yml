name: DEV Environment Deployment
on:
  push:
    branches:
      - Develop
  workflow_dispatch:

jobs:
  Build-Deploy:
    name: Build Java Application
    runs-on: ubuntu-latest
    environment:
      name: DEV

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set-up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin 
          java-version: '17'
          cache: maven

      - name: Build War File 
        run: mvn -B clean verify

      - name: Verify WAR File
        run: |
          ls -lh target/
          test -f target/MovieTicketBooking.war

      - name: Deploy WAR to DEV Environment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ Secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
           curl --fail-with-body \
            --silent --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file ./artifact/MovieTicketBooking.war \
            "$TOMCAT_HOST/manager/text/deploy?path=/MovieTicketBooking&update=true"

      - name: Deployed Successfully
        run: echo "WAR File deployed Successfully"
