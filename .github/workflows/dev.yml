
name: DEV Environment - CI/CD

on:
  push:
    branches:
      - Develop

  workflow_dispatch:

jobs:

  build:
    name: Build Java Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify WAR File
        run: |
          ls -lh target/
          test -f target/MovieTicketBooking.war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieTicketBooking-WAR
          path: target/MovieTicketBooking.war

  deploy:
    name: Deploy to DEV Tomcat
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:

      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: MovieTicketBooking-WAR
          path: ./artifact

      - name: Deploy WAR to DEV Tomcat
        run: |
          curl --fail-with-body \
            --silent --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file ./artifact/MovieTicketBooking.war \
            "$TOMCAT_HOST/manager/text/deploy?path=/MovieTicketBooking&update=true"

        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}

