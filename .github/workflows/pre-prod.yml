
name: CI/CD for Pre-Prod Branch

on:
  push:
    branches:
      - pre-prod

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy Java Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./MovieTicketBooking

    environment:
      name: PRE-PROD

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set-up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build WAR File
        run: mvn -B clean verify

      - name: Verify WAR File
        run: |
          ls -lh target/
          test -f target/MovieTicketBooking.war

      - name: Deploy WAR to PRE-PROD Environment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          curl --fail-with-body \
            --silent --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file target/MovieTicketBooking.war \
            "$TOMCAT_HOST/manager/text/deploy?path=/MovieTicketBooking&update=true"

      - name: Deployment Successful
        run: echo "WAR file deployed successfully to PRE-PROD environment"
